services:
  - type: web
    name: property-portal
    runtime: python
    plan: free
    branch: main
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate"
    startCommand: "gunicorn config.wsgi:application"
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        sync: false
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: WHATSAPP_NUMBER
        sync: false
      # Brevo — sends the "new inquiry" email notification via HTTPS API
      # (SMTP ports are blocked on Render's network). Get this from
      # Brevo → Settings → SMTP & API → API Keys.
      - key: BREVO_API_KEY
        sync: false
      # Meta WhatsApp Cloud API — sends the "new inquiry" WhatsApp alert.
      # Leave both blank to skip WhatsApp notifications.
      - key: WHATSAPP_CLOUD_API_TOKEN
        sync: false
      - key: WHATSAPP_CLOUD_PHONE_NUMBER_ID
        sync: false
