services:
  - type: web
    name: property-portal
    runtime: python
    plan: free
    branch: main
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput --upload-unhashed-files && python manage.py migrate"
    # --timeout 180: gunicorn's 30s default kills the worker before AI
    # deed extraction (duediligence's "Extract with AI") finishes — a real
    # scanned deed PDF measured at ~90s against Gemini.
    #
    # --workers 1 --threads 4 --worker-class gthread: a single sync worker
    # (the previous default) means the ENTIRE site can only serve one
    # request at a time — any one slow request (a ~90s AI call, or worse,
    # several queued back to back) blocks every other visitor for its
    # full duration. Confirmed live: this caused a genuine 15-20 minute
    # site-wide outage. Threads, not a second worker process, because the
    # 512MB free-tier instance can't safely afford a second full copy of
    # this app's memory footprint (LangChain/Cloudinary/etc. all loaded
    # again) — one process with threads shares that footprint, and
    # threads still run concurrently during I/O waits (DB queries,
    # external API calls) since Python releases the GIL for those, which
    # is exactly what was blocking here.
    startCommand: "gunicorn config.wsgi:application --timeout 180 --workers 1 --threads 4 --worker-class gthread"
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        sync: false
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: WHATSAPP_NUMBER
        sync: false
      # Brevo — sends the "new inquiry" email notification via HTTPS API
      # (SMTP ports are blocked on Render's network). Get this from
      # Brevo → Settings → SMTP & API → API Keys.
      - key: BREVO_API_KEY
        sync: false
      # Meta WhatsApp Cloud API — sends the "new inquiry" WhatsApp alert.
      # Leave both blank to skip WhatsApp notifications.
      - key: WHATSAPP_CLOUD_API_TOKEN
        sync: false
      - key: WHATSAPP_CLOUD_PHONE_NUMBER_ID
        sync: false
      # Cloudinary — persists property photos uploaded via admin (Render's
      # filesystem is ephemeral and wipes local media/ on every deploy).
      # Format: cloudinary://API_KEY:API_SECRET@CLOUD_NAME
      - key: CLOUDINARY_URL
        sync: false
