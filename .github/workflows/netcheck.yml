name: netcheck (temporary investigation)

on:
  workflow_dispatch:

jobs:
  netcheck:
    runs-on: ubuntu-latest
    steps:
      - name: Check egress IP
        run: curl -s https://api.ipify.org; echo
      - name: Curl bhulekh.uk.gov.in
        run: |
          curl -v --max-time 15 "https://bhulekh.uk.gov.in/public/public_ror/Public_ROR.jsp" || echo "CURL_FAILED exit=$?"
